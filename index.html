<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crop & Translate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    #crop-container { max-width: 100%; max-height: 400px; margin-top: 10px; }
    img { max-width: 100%; }
    .btn { padding: 8px 16px; margin-top: 10px; cursor: pointer; }
    #result { margin-top: 20px; padding: 10px; background: #f4f4f4; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h3>Crop & Translate Tool</h3>
  <input type="file" id="imageInput" accept="image/*">
  
  <div style="margin: 10px 0;">
    <label>Target Language: </label>
    <select id="lang">
      <option value="Hinglish">Hinglish</option>
      <option value="Hindi">Hindi</option>
      <option value="English">English</option>
    </select>
  </div>

  <div id="crop-container">
    <img id="imageToCrop" src="" style="display:none;">
  </div>

  <button class="btn" id="translateBtn" style="display:none;">Translate Selection</button>
  <div id="result">Upload or paste a screenshot to start.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    let cropper;
    const imageInput = document.getElementById('imageInput');
    const imageToCrop = document.getElementById('imageToCrop');
    const translateBtn = document.getElementById('translateBtn');
    const resultDiv = document.getElementById('result');

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      imageToCrop.src = url;
      imageToCrop.style.display = 'block';

      if (cropper) cropper.destroy();
      cropper = new Cropper(imageToCrop, { aspectRatio: NaN, viewMode: 1 });
      translateBtn.style.display = 'inline-block';
    });

    translateBtn.addEventListener('click', () => {
      if (!cropper) return;
      resultDiv.innerText = "Translating...";

      cropper.getCroppedCanvas().toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('image', blob, 'cropped.png');
        formData.append('target_lang', document.getElementById('lang').value);

        try {
          const res = await fetch('/translate', { method: 'POST', body: formData });
          const data = await res.json();
          resultDiv.innerText = data.result || data.error || "Translation failed.";
        } catch (err) {
          resultDiv.innerText = "Error connecting to server.";
        }
      }, 'image/png');
    });
  </script>
</body>
</html>
